<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cotización Dólar Blue</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f4f4f4;display:flex;justify-content:center;align-items:center;min-height:100vh}.container{background:#fff;padding:30px;width:400px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2)}h1{text-align:center;margin-bottom:20px}label{display:block;margin-top:10px;font-weight:bold}input{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:5px}button{width:100%;margin-top:20px;padding:12px;border:none;border-radius:5px;background:#0078d4;color:#fff;cursor:pointer}#resultado{margin-top:20px;text-align:center;font-weight:bold}.error{color:red}.success{color:green}</style></head><body><div class="container"><h1>Dólar Blue</h1><label>Palabra Secreta</label><input type="password" id="password"><label>DNI</label><input type="number" id="dni"><button onclick="consultarCotizacion()">Consultar</button><div id="resultado"></div></div><script>function consultarCotizacion(){const palabraSecreta='DOLAR2026';const password=document.getElementById('password').value;const dni=document.getElementById('dni').value;const resultado=document.getElementById('resultado');if(password!==palabraSecreta){resultado.className='error';resultado.innerHTML='Palabra secreta incorrecta';return;}if(dni===''){resultado.className='error';resultado.innerHTML='Debe ingresar un DNI';return;}const ultimosDosDigitos=Number(dni.slice(-2));const dolarBlue=1200+ultimosDosDigitos;resultado.className='success';resultado.innerHTML='DNI: '+dni+'<br>Cotización Dólar Blue: $'+dolarBlue;}</script></body></html>
